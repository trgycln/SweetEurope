name: Synthetic Monitoring

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch: # Manuel tetikleme için

jobs:
  smoke-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Production Smoke Test
      run: npx playwright test tests/e2e/smoke-production.spec.ts
      env:
        SMOKE_TEST: 'true'
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    - name: Alert on Failure
      if: failure()
      run: |
        echo "::error title=Smoke Test Failed::Production smoke test failed! The site might be down or degraded."
        if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
          curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *CRITICAL ALERT:* Production Smoke Test Failed! The site might be down or degraded. Please check GitHub Actions logs immediately."}' "${{ secrets.SLACK_WEBHOOK_URL }}"
        else
          echo "SLACK_WEBHOOK_URL is not set, skipping Slack notification."
        fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: smoke-test-report
        path: playwright-report/
        retention-days: 30
